<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430">
<defs>
 <linearGradient id="feralBg" x1="0%" y1="0%" x2="100%" y2="100%">
  <stop offset="0%" stop-color="#0B0618"/><stop offset="35%" stop-color="#25114A"/><stop offset="62%" stop-color="#5B1D67"/><stop offset="82%" stop-color="#B52A86"/><stop offset="100%" stop-color="#F05AA9"/>
 </linearGradient>
 <linearGradient id="route" x1="0" x2="1"><stop stop-color="#FF2BA6"/><stop offset=".5" stop-color="#8B5CF6"/><stop offset="1" stop-color="#F05CFF"/></linearGradient>
 <filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <style>
  .title{font:700 14px Arial,sans-serif;fill:#FFFFFF}
  .sub{font:600 12px Arial,sans-serif;fill:#FFFFFF}
  .date{font:500 11px Arial,sans-serif;fill:#F8EAF6}
  .node{fill:#21002D;stroke:#FFB3E5;stroke-width:4}
  .num{font:700 12px Arial,sans-serif;fill:#FFFFFF}
 </style>
</defs>

<rect x="10" y="10" width="1180" height="410" rx="30" fill="url(#feralBg)"/>

<!-- Animated star field -->
<g fill="#FFFFFF">
 <g><circle cx="62" cy="54" r="1.2"/><animate attributeName="opacity" values=".25;.9;.25" dur="2.4s" repeatCount="indefinite"/></g>
 <g><circle cx="205" cy="48" r="1.1"/><animate attributeName="opacity" values=".8;.2;.8" dur="3.1s" repeatCount="indefinite"/></g>
 <g><circle cx="355" cy="39" r="1.4"/><animate attributeName="opacity" values=".3;1;.3" dur="2.8s" repeatCount="indefinite"/></g>
 <g><circle cx="525" cy="42" r="1.1"/><animate attributeName="opacity" values=".8;.25;.8" dur="2.1s" repeatCount="indefinite"/></g>
 <g><circle cx="700" cy="45" r="1.3"/><animate attributeName="opacity" values=".25;.95;.25" dur="3.4s" repeatCount="indefinite"/></g>
 <g><circle cx="875" cy="48" r="1.1"/><animate attributeName="opacity" values=".8;.2;.8" dur="2.6s" repeatCount="indefinite"/></g>
 <g><circle cx="1060" cy="45" r="1.3"/><animate attributeName="opacity" values=".3;1;.3" dur="3.0s" repeatCount="indefinite"/></g>
 <g><circle cx="122" cy="255" r="1.2"/><animate attributeName="opacity" values=".2;.8;.2" dur="2.7s" repeatCount="indefinite"/></g>
 <g><circle cx="315" cy="240" r="1.1"/><animate attributeName="opacity" values=".8;.25;.8" dur="3.3s" repeatCount="indefinite"/></g>
 <g><circle cx="485" cy="255" r="1.2"/><animate attributeName="opacity" values=".25;.9;.25" dur="2.2s" repeatCount="indefinite"/></g>
 <g><circle cx="760" cy="250" r="1.1"/><animate attributeName="opacity" values=".8;.2;.8" dur="3.2s" repeatCount="indefinite"/></g>
 <g><circle cx="965" cy="245" r="1.2"/><animate attributeName="opacity" values=".25;.95;.25" dur="2.5s" repeatCount="indefinite"/></g>
 <g><circle cx="1150" cy="255" r="1.1"/><animate attributeName="opacity" values=".7;.2;.7" dur="3.5s" repeatCount="indefinite"/></g>
 <g><circle cx="180" cy="390" r=".9"/><animate attributeName="opacity" values=".2;.75;.2" dur="2.9s" repeatCount="indefinite"/></g>
 <g><circle cx="300" cy="350" r="1.2"/><animate attributeName="opacity" values=".8;.2;.8" dur="2.3s" repeatCount="indefinite"/></g>
 <g><circle cx="780" cy="395" r=".9"/><animate attributeName="opacity" values=".2;.8;.2" dur="3.6s" repeatCount="indefinite"/></g>
 <g><circle cx="935" cy="360" r="1.2"/><animate attributeName="opacity" values=".8;.25;.8" dur="2.7s" repeatCount="indefinite"/></g>
</g>

<!-- Moving sparkle stars -->
<g fill="#FFFFFF">
 <g transform="translate(110 55)"><circle r="2.5"/><path d="M0-17L2-2L17 0L2 2L0 17L-2 2L-17 0L-2-2Z" opacity=".5"><animate attributeName="opacity" values=".15;.8;.15" dur="2.2s" repeatCount="indefinite"/></path><animateTransform attributeName="transform" type="translate" values="110 55;116 61;110 55" dur="4s" repeatCount="indefinite"/></g>
 <g transform="translate(405 65)"><circle r="2.2"/><path d="M0-14L2-2L14 0L2 2L0 14L-2 2L-14 0L-2-2Z" opacity=".5"><animate attributeName="opacity" values=".1;.75;.1" dur="2.8s" repeatCount="indefinite"/></path><animateTransform attributeName="transform" type="translate" values="405 65;399 59;405 65" dur="3.5s" repeatCount="indefinite"/></g>
 <g transform="translate(790 55)"><circle r="2.7"/><path d="M0-17L2-2L17 0L2 2L0 17L-2 2L-17 0L-2-2Z" opacity=".5"><animate attributeName="opacity" values=".15;.9;.15" dur="2.5s" repeatCount="indefinite"/></path><animateTransform attributeName="transform" type="translate" values="790 55;797 48;790 55" dur="4.2s" repeatCount="indefinite"/></g>
 <g transform="translate(1045 215)"><circle r="2.6"/><path d="M0-17L2-2L17 0L2 2L0 17L-2 2L-17 0L-2-2Z" opacity=".5"><animate attributeName="opacity" values=".1;.85;.1" dur="2.1s" repeatCount="indefinite"/></path><animateTransform attributeName="transform" type="translate" values="1045 215;1038 220;1045 215" dur="3.8s" repeatCount="indefinite"/></g>
</g>

<!-- Animated border -->
<rect x="10" y="10" width="1180" height="410" rx="30" fill="none" stroke="#FF4DB8" stroke-width="2" stroke-dasharray="3 24" stroke-linecap="round">
 <animate attributeName="stroke-dashoffset" from="0" to="-108" dur="2.8s" repeatCount="indefinite"/>
</rect>
<rect x="16" y="16" width="1168" height="398" rx="25" fill="none" stroke="#F5B3FF" stroke-width="1" stroke-dasharray="1 34" stroke-linecap="round" opacity=".8">
 <animate attributeName="stroke-dashoffset" from="0" to="140" dur="4.5s" repeatCount="indefinite"/>
</rect>

<!-- Equal 320px spacing: 1 -> 2 -> 3 -> 4 -->
<path d="M170 105 C250 105 410 325 490 325 C570 325 730 105 810 105 C890 105 1050 325 1130 325"
 fill="none" stroke="#FFD1F2" stroke-width="13" opacity=".13" filter="url(#glow)"/>
<path d="M170 105 C250 105 410 325 490 325 C570 325 730 105 810 105 C890 105 1050 325 1130 325"
 fill="none" stroke="url(#route)" stroke-width="5" stroke-linecap="round" stroke-dasharray="15 9">
 <animate attributeName="stroke-dashoffset" from="0" to="-96" dur="2.1s" repeatCount="indefinite"/>
</path>

<!-- Point 1 -->
<g transform="translate(170 105)">
 <circle r="29" class="node" filter="url(#glow)"/>
 <text x="-10" y="7" font-size="18">🎓</text>
 <circle cx="22" cy="-23" r="12" fill="#FF2BA6"/><text x="18" y="-19" class="num">1</text>
 <text x="-64" y="-55" class="title">Vidya Mandhir Matriculation Hr School.</text>
 <text x="-64" y="-38" class="sub">HSC • 82%</text>
 <text x="-64" y="-22" class="date">Jun 2022 – Mar 2023</text>
</g>

<!-- Point 2 -->
<g transform="translate(490 325)">
 <circle r="29" class="node" filter="url(#glow)"/>
 <text x="-10" y="7" font-size="18">🎓</text>
 <circle cx="22" cy="-23" r="12" fill="#8B5CF6"/><text x="18" y="-19" class="num">2</text>
 <text x="-83" y="57" class="title">PSG College of Arts &amp; Science</text>
 <text x="-83" y="74" class="sub">B.Sc. in Computer Science • CGPA: 8/10</text>
 <text x="-83" y="90" class="date">Jun 2023 – May 2026</text>
</g>

<!-- Point 3 -->
<g transform="translate(810 105)">
 <circle r="29" class="node" filter="url(#glow)"/>
 <text x="-10" y="7" font-size="18">💻</text>
 <circle cx="22" cy="-23" r="12" fill="#FF2BA6"/><text x="18" y="-19" class="num">3</text>
 <text x="-60" y="-55" class="title">Career Ladder</text>
 <text x="-60" y="-38" class="sub">Python Full Stack Web Development Intern</text>
 <text x="-60" y="-22" class="date">May 2025 – Jun 2025</text>
</g>

<!-- Point 4 -->
<g transform="translate(1130 325)">
 <circle r="29" class="node" filter="url(#glow)"/>
 <text x="-10" y="7" font-size="18">📊</text>
 <circle cx="22" cy="-23" r="12" fill="#F05CFF"/><text x="18" y="-19" class="num">4</text>
 <text x="-70" y="57" class="title">DecodeLabs</text>
 <text x="-70" y="74" class="sub">Data Analytics Intern</text>
 <text x="-70" y="90" class="date">Jun 2026 – Jul 2026</text>
</g>
</svg>