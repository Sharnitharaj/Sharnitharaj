<svg xmlns="http://www.w3.org/2000/svg" width="920" height="95" viewBox="0 0 920 95" role="img" aria-label="Find the Analyst">
<defs>
  <linearGradient id="txt" x1="0" y1="0" x2="1" y2="0">
    <stop stop-color="#FFFFFF"/><stop offset=".45" stop-color="#F5B8FF"/><stop offset=".7" stop-color="#FF2BB3"/><stop offset="1" stop-color="#FFFFFF"/>
    <animate attributeName="x1" values="0;1;0" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="x2" values="1;0;1" dur="4s" repeatCount="indefinite"/>
  </linearGradient>
  <filter id="g"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<circle cx="86" cy="29" r="2" fill="#FF8BD5"><animate attributeName="cy" values="29;64;29" dur="2.8s" repeatCount="indefinite"/></circle>
<circle cx="836" cy="60" r="2" fill="#C084FC"><animate attributeName="cy" values="60;25;60" dur="3.2s" repeatCount="indefinite"/></circle>
<circle cx="165" cy="70" r="1.5" fill="#FFFFFF"><animate attributeName="cx" values="165;190;165" dur="2.4s" repeatCount="indefinite"/></circle>
<text x="460" y="53" text-anchor="middle" font-family="Arial,sans-serif" font-size="31" font-weight="900" letter-spacing="3" fill="url(#txt)" filter="url(#g)">🔍 FIND THE ANALYST</text>
<path d="M190 72 C330 82 590 82 730 72" fill="none" stroke="#D400FF" stroke-width="2" stroke-dasharray="10 9" opacity=".8">
  <animate attributeName="stroke-dashoffset" from="0" to="-38" dur="2s" repeatCount="indefinite"/>
</path>
<circle cx="190" cy="72" r="2.5" fill="#FF2BB3"/><circle cx="730" cy="72" r="2.5" fill="#A78BFA"/>
</svg>